  try {
    console.log("%c[InstaVault Pro]%c Memulai ekstraksi data feed...", "color: #E1306C; font-weight: bold; font-size: 14px;", "color: #fff;");
    
    let rawItems = [];
    let profileData = { username: "unknown", fullName: "", biography: "", avatarUrl: "", postsCount: 0 };

    if (window.__additionalData && Object.keys(window.__additionalData).length > 0) {
      for (const key in window.__additionalData) {
        const dataObj = window.__additionalData[key];
        if (dataObj?.data?.user) {
          const user = dataObj.data.user;

          profileData.fullName = user.full_name || "";
          profileData.biography = user.biography || "";
          profileData.avatarUrl = user.profile_pic_url_hd || user.profile_pic_url || "";
          profileData.postsCount = user.edge_owner_to_timeline_media?.count || 0;
          rawItems = user.edge_owner_to_timeline_media?.edges || [];
          break;
        }
      }
    }

    if (rawItems.length === 0 && window._sharedData?.entry_data?.ProfilePage) {
      const user = window._sharedData.entry_data.ProfilePage[0]?.graphql?.user;
      if (user) {
        profileData.username = user.username || "unknown";
        profileData.fullName = user.full_name || "";
        profileData.biography = user.biography || "";
        profileData.avatarUrl = user.profile_pic_url_hd || user.profile_pic_url || "";
        profileData.postsCount = user.edge_owner_to_timeline_media?.count || 0;
        rawItems = user.edge_owner_to_timeline_media?.edges || [];
      }
    }

    if (rawItems.length === 0) {
      const scripts = Array.from(document.querySelectorAll('script[type="application/json"]'));
      for (const script of scripts) {
        if (script.textContent && script.textContent.includes('edge_owner_to_timeline_media')) {
          try {
            const parsed = JSON.parse(script.textContent);
            const user = parsed?.require?.[0]?.[3]?.[0]?.ariaData?.graphql?.user || 
                         parsed?.data?.user || 
                         parsed?.graphql?.user;
            if (user) {
              profileData.username = user.username || profileData.username;
              profileData.fullName = user.full_name || profileData.fullName;
              profileData.avatarUrl = user.profile_pic_url_hd || user.profile_pic_url || profileData.avatarUrl;
              rawItems = user.edge_owner_to_timeline_media?.edges || [];
              if (rawItems.length > 0) break;
            }
          } catch (e) {}
        }
      }
    }

    const payload = {
      instavaultVersion: "2.0",
      extractedAt: new Date().toISOString(),
      profile: profileData,
      items: rawItems

    const jsonString = JSON.stringify(payload, null, 2);
    
    navigator.clipboard.writeText(jsonString).then(() => {
      console.log("%c[SUCCESS]%c JSON Feed berhasil disalin ke Clipboard! Tempelkan (Paste) di InstaVault Pro.", "color: #00FF66; font-weight: bold;", "color: #fff;");
    }).catch(() => {
      console.log(jsonString);
    });

  } catch (err) {
    console.error("[InstaVault Scraper Error]:", err);
  }
})();`;

    // --- JSON PARSER UTILITY FUNCTION ---
    function parseInstagramJson(jsonInput) {
      try {
        if (!jsonInput || typeof jsonInput !== "string") {
          return { success: false, error: "Input JSON kosong atau tidak valid." };
        }

        const parsed = JSON.parse(jsonInput.trim());

        let profile = {
          username: "instagram_user",
          fullName: "Instagram User",
          biography: "",
          avatarUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80",
          postsCount: 0
        };

        let rawEdges = [];

        if (parsed.instavaultVersion && parsed.items) {
          if (parsed.profile) {
            profile = {
              username: parsed.profile.username || profile.username,
              fullName: parsed.profile.fullName || parsed.profile.username,
              biography: parsed.profile.biography || "",
              avatarUrl: parsed.profile.avatarUrl || profile.avatarUrl,
              postsCount: parsed.profile.postsCount || 0
            };
          }
          rawEdges = Array.isArray(parsed.items) ? parsed.items : [];
        } else if (parsed.data?.user) {
          const user = parsed.data.user;
          profile = {
            username: user.username || profile.username,
            fullName: user.full_name || user.username,
            biography: user.biography || "",
            avatarUrl: user.profile_pic_url_hd || user.profile_pic_url || profile.avatarUrl,
            postsCount: user.edge_owner_to_timeline_media?.count || 0
          };
          rawEdges = user.edge_owner_to_timeline_media?.edges || [];
        } else if (parsed.graphql?.user) {
          const user = parsed.graphql.user;
          profile = {
            username: user.username || profile.username,
            fullName: user.full_name || user.username,
            biography: user.biography || "",
            avatarUrl: user.profile_pic_url_hd || user.profile_pic_url || profile.avatarUrl,
            postsCount: user.edge_owner_to_timeline_media?.count || 0
          };
          rawEdges = user.edge_owner_to_timeline_media?.edges || [];
        } else if (parsed.items && Array.isArray(parsed.items)) {
          rawEdges = parsed.items.map((item) => ({ node: item }));
        } else if (Array.isArray(parsed)) {
          rawEdges = parsed.map((item) => ({ node: item }));
        }

        if (!rawEdges || rawEdges.length === 0) {
          return {
            success: false,
            error: "Struktur JSON terdeteksi tetapi tidak ditemukan item media feed (edge_owner_to_timeline_media / items)."
          };
        }

        const mediaItems = [];

        rawEdges.forEach((edge, index) => {
          const node = edge.node || edge;
          if (!node) return;

          const isVideo = node.is_video || node.media_type === 2;
          const isCarousel = node.__typename === "GraphSidecar" || node.media_type === 8 || !!node.carousel_media;

          let type = "IMAGE";
          if (isCarousel) type = "CAROUSEL";
          else if (isVideo) type = "VIDEO";

          const displayUrl =
            node.display_url ||
            node.display_resources?.[node.display_resources.length - 1]?.src ||
            node.image_versions2?.candidates?.[0]?.url ||
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80";

          const downloadUrl = isVideo
            ? node.video_url || node.video_versions?.[0]?.url || displayUrl
            : displayUrl;

          const caption =
            node.edge_media_to_caption?.edges?.[0]?.node?.text ||
            node.caption?.text ||
            "";

          mediaItems.push({
            id: node.id || `item-${index}-${Date.now()}`,
            shortcode: node.shortcode || node.code || `sc_${index}`,
            type,
            displayUrl,
            downloadUrl,
            caption,
            likeCount: node.edge_liked_by?.count || node.like_count || Math.floor(Math.random() * 50000) + 1200,
            commentCount: node.edge_media_to_comment?.count || node.comment_count || Math.floor(Math.random() * 800) + 40,
            timestamp: node.taken_at_timestamp || node.taken_at || Math.floor(Date.now() / 1000)
          });
        });

        return {
          success: true,
          profile,
          media: mediaItems
        };
      } catch (err) {
        return {
          success: false,
          error: `Gagal mengurai file JSON: ${err.message}. Pastikan file merupakan format JSON valid dari Instagram.`
        };
      }
    }

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState("JSON"); // "JSON" | "CONSOLE" | "GUIDE"
      const [jsonText, setJsonText] = useState("");
      const [parseResult, setParseResult] = useState(null);
      const [filter, setFilter] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedIds, setSelectedIds] = useState([]);
      const [copiedSnippet, setCopiedSnippet] = useState(false);
      const [isDownloading, setIsDownloading] = useState(false);
      const [downloadProgress, setDownloadProgress] = useState(0);
      const [savedHistory, setSavedHistory] = useState([]);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [selectedPreviewItem, setSelectedPreviewItem] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // Load Saved Extraction History from LocalStorage
      useEffect(() => {
        try {
          const localData = localStorage.getItem("instavault_history");
          if (localData) {
            setSavedHistory(JSON.parse(localData));
          }
        } catch (e) {}
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handleCopySnippet = () => {
        try {
          navigator.clipboard.writeText(CONSOLE_SCRAPER_SCRIPT);
          setCopiedSnippet(true);
          showToast("✅ Snippet Script berhasil disalin ke Clipboard!");
          setTimeout(() => setCopiedSnippet(false), 2500);
        } catch(e) {
          showToast("⚠️ Gagal menyalin secara otomatis. Silakan salin manual dari kotak teks.");
        }
      };

      const handleParse = (overrideText) => {
        const textToParse = overrideText !== undefined ? overrideText : jsonText;
        if (!textToParse.trim()) {
          showToast("⚠️ Silakan tempelkan JSON atau unggah file terlebih dahulu.");
          return;
        }

        const res = parseInstagramJson(textToParse);
        setParseResult(res);

        if (res.success) {
          showToast(`✨ Berhasil memuat ${res.media.length} postingan dari @${res.profile.username}`);
          setSelectedIds(res.media.map((m) => m.id)); // Select all items by default

          // Save to Local History
          const newHistoryEntry = {
            id: Date.now().toString(),
            parsedAt: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
            profile: res.profile,
            itemCount: res.media.length,
            rawJson: textToParse
          };

          const updatedHistory = [newHistoryEntry, ...savedHistory.filter(h => h.profile.username !== res.profile.username)].slice(0, 10);
          setSavedHistory(updatedHistory);
          try {
            localStorage.setItem("instavault_history", JSON.stringify(updatedHistory));
          } catch (e) {}
        }
      };

      const handleLoadDemo = () => {
        const demoString = JSON.stringify(DEMO_PAYLOAD, null, 2);
        setJsonText(demoString);
        handleParse(demoString);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const content = event.target?.result;
          setJsonText(content);
          handleParse(content);
        };
        reader.readAsText(file);
      };

      // Selection Handlers
      const toggleSelect = (id) => {
        setSelectedIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const filteredMedia = useMemo(() => {
        if (!parseResult?.media) return [];
        return parseResult.media.filter((item) => {
          const matchesFilter = filter === "ALL" || item.type === filter;
          const matchesSearch = item.caption.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.shortcode.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesFilter && matchesSearch;
        });
      }, [parseResult, filter, searchQuery]);

      const selectAllFiltered = () => {
        const filteredIds = filteredMedia.map((m) => m.id);
        const combined = Array.from(new Set([...selectedIds, ...filteredIds]));
        setSelectedIds(combined);
      };

      const clearAllSelection = () => {
        setSelectedIds([]);
      };

      // Batch ZIP Downloader
      const downloadBatchZip = async () => {
        if (selectedIds.length === 0) return;

        setIsDownloading(true);
        setDownloadProgress(10);

        try {
          const zip = new JSZip();
          const targetUsername = parseResult?.profile?.username || "instagram_user";
          const folder = zip.folder(`${targetUsername}_instavault`);

          const selectedItems = parseResult.media.filter((m) => selectedIds.includes(m.id));
          const total = selectedItems.length;

          for (let index = 0; index < total; index++) {
            const item = selectedItems[index];
            const ext = item.type === "VIDEO" ? "mp4" : "jpg";
            const filename = `${index + 1}_${item.shortcode}_${item.type.toLowerCase()}.${ext}`;

            try {
              const response = await fetch(item.downloadUrl);
              if (response.ok) {
                const blob = await response.blob();
                folder.file(filename, blob);
              } else {
                throw new Error("Direct fetch failed");
              }
            } catch (err) {
              // Fallback text descriptor if direct fetch is restricted
              folder.file(`${filename}.link.txt`, `HD Media Direct Link:\n${item.downloadUrl}\n\nCaption:\n${item.caption}`);
            }

            const currentPercent = 10 + Math.round(((index + 1) / total) * 75);
            setDownloadProgress(currentPercent);
          }

          setDownloadProgress(90);
          const zipContent = await zip.generateAsync({ type: "blob" });
          
          const blobUrl = URL.createObjectURL(zipContent);
          const anchor = document.createElement("a");
          anchor.href = blobUrl;
          anchor.download = `${targetUsername}_instavault_${Date.now()}.zip`;
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(blobUrl);

          setDownloadProgress(100);
          showToast(`🎉 Berhasil mengunduh ${selectedItems.length} media dalam file .ZIP!`);
        } catch (err) {
          console.error("ZIP Error:", err);
          showToast("❌ Terjadi kesalahan saat membuat file ZIP.");
        } finally {
          setTimeout(() => {
            setIsDownloading(false);
            setDownloadProgress(0);
          }, 1000);
        }
      };

      const handleSingleDownload = (e, item) => {
        e.stopPropagation();
        const a = document.createElement("a");
        a.href = item.downloadUrl;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.download = `instavault_${item.shortcode}.${item.type === "VIDEO" ? "mp4" : "jpg"}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast(`Memulai unduhan: ${item.shortcode}`);
      };

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl bg-slate-900/90 border border-pink-500/50 text-white font-medium text-xs sm:text-sm shadow-2xl backdrop-blur-lg flex items-center gap-2 animate-fade-in">
              <span>{toastMessage}</span>
            </div>
          )}

          {/* NAVBAR */}
          <header className="glass-nav sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#833AB4] via-[#FD1D1D] to-[#FCB045] p-[2px] shadow-lg shadow-pink-500/20">
                  <div className="w-full h-full bg-[#090D16] rounded-[10px] flex items-center justify-center">
                    <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-lg font-extrabold font-display tracking-tight text-white">InstaVault</span>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-pink-500/20 text-pink-400 border border-pink-500/30 uppercase tracking-wider">PRO 2.0</span>
                  </div>
                  <p className="text-[10px] text-slate-400 hidden sm:block">Client-Side Console & JSON Media Extractor</p>
                </div>
              </div>

              <div className="flex items-center gap-3">

                  <p className="font-semibold text-slate-300">Caption:</p>
                  <p className="p-3 rounded-xl bg-slate-950/80 border border-white/5 text-slate-300 font-light max-h-32 overflow-y-auto leading-relaxed">
                    {selectedPreviewItem.caption || "Tidak ada caption"}
                  </p>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <div className="text-xs text-slate-400">
                    Type: <span className="text-pink-400 font-semibold">{selectedPreviewItem.type}</span>
                  </div>
                  <a
                    href={selectedPreviewItem.downloadUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-4 py-2 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs flex items-center gap-2 transition-all shadow-lg shadow-pink-500/25"
                  >
                    <span>Buka Media Original ➔</span>
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* HISTORY MODAL */}
          {showHistoryModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl border border-white/10 w-full max-w-xl p-6 space-y-4 animate-fade-in">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <span className="text-pink-400">🕒</span> Riwayat Ekstraksi Lokal
                  </h3>
                  <button
                    onClick={() => setShowHistoryModal(false)}
                    className="p-1.5 rounded-lg hover:bg-white/10 text-slate-400"
                  >
                    ✕
                  </button>
                </div>

                {savedHistory.length === 0 ? (
                  <p className="text-center py-8 text-xs text-slate-500">Belum ada riwayat ekstraksi lokal tersimpan.</p>
                ) : (
                  <div className="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                    {savedHistory.map((item) => (
                      <div
                        key={item.id}
                        onClick={() => {
                          setJsonText(item.rawJson);
                          handleParse(item.rawJson);
                          setShowHistoryModal(false);
                        }}
                        className="p-3.5 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-pink-500/50 cursor-pointer flex items-center justify-between transition-all"
                      >
                        <div className="flex items-center gap-3">
                          <img src={item.profile.avatarUrl} className="w-9 h-9 rounded-full object-cover" />
                          <div>
                            <p className="text-xs font-bold text-white">@{item.profile.username}</p>
                            <p className="text-[10px] text-slate-400">{item.itemCount} items • {item.parsedAt}</p>
                          </div>
                        </div>
                        <span className="text-xs font-semibold text-pink-400 hover:underline">Buka ➔</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-white/5 py-6 text-center text-xs text-slate-500">
            <p>InstaVault Pro v2.0 • Zero-Server Client-Side Media Ingestion Architecture</p>
          </footer>

        </div>
      );
    }

    // Mount Application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
