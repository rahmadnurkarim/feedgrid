    function urlToBlobViaCanvas(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            canvas.toBlob((blob) => {
              if (blob) resolve(blob);
              else reject(new Error("Canvas blob conversion failed"));
            }, "image/jpeg", 0.95);
          } catch (e) {
            reject(e);
          }
        };
        img.onerror = (e) => reject(new Error("Image load error for canvas conversion"));
        img.src = url;
      });
    }

        document.body.appendChild(textArea);
        textArea.focus();

        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        return successful;

    function parseInstagramJson(jsonInput) {
      try {
        if (!jsonInput || typeof jsonInput !== "string") {
          return { success: false, error: "Input JSON kosong atau tidak valid." };
        }

        const parsed = JSON.parse(jsonInput.trim());

        let profile = {
          username: "instagram_user",
          fullName: "Instagram User",
          biography: "",
          avatarUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80",
          postsCount: 0
        };

        let rawEdges = [];

        if (parsed.instavaultVersion && parsed.items) {
          if (parsed.profile) {
            profile = {
              username: parsed.profile.username || profile.username,
              fullName: parsed.profile.fullName || parsed.profile.username,
              biography: parsed.profile.biography || "",
              avatarUrl: parsed.profile.avatarUrl || profile.avatarUrl,
              postsCount: parsed.profile.postsCount || 0
            };
          }
          rawEdges = Array.isArray(parsed.items) ? parsed.items : [];
        } else if (parsed.data?.user) {
          const user = parsed.data.user;
          profile = {
            username: user.username || profile.username,
            fullName: user.full_name || user.username,
            biography: user.biography || "",
            avatarUrl: user.profile_pic_url_hd || user.profile_pic_url || profile.avatarUrl,
            postsCount: user.edge_owner_to_timeline_media?.count || 0
          };
          rawEdges = user.edge_owner_to_timeline_media?.edges || [];
        } else if (parsed.graphql?.user) {
          const user = parsed.graphql.user;
          profile = {
            username: user.username || profile.username,
            fullName: user.full_name || user.username,
            biography: user.biography || "",
            avatarUrl: user.profile_pic_url_hd || user.profile_pic_url || profile.avatarUrl,
            postsCount: user.edge_owner_to_timeline_media?.count || 0
          };
          rawEdges = user.edge_owner_to_timeline_media?.edges || [];
        } else if (parsed.items && Array.isArray(parsed.items)) {
          rawEdges = parsed.items.map((item) => ({ node: item }));
        } else if (Array.isArray(parsed)) {
          rawEdges = parsed.map((item) => ({ node: item }));
        }

        if (!rawEdges || rawEdges.length === 0) {
          return {
            success: false,
            error: "Struktur JSON terdeteksi tetapi tidak ditemukan item media feed."
          };
        }

        const mediaItems = [];

        rawEdges.forEach((edge, index) => {
          const node = edge.node || edge;
          if (!node) return;

          const isVideo = node.is_video || node.media_type === 2;
          const isCarousel = node.__typename === "GraphSidecar" || node.media_type === 8 || !!node.carousel_media;

          let type = "IMAGE";
          if (isCarousel) type = "CAROUSEL";
          else if (isVideo) type = "VIDEO";

          const displayUrl =
            node.display_url ||
            node.display_resources?.[node.display_resources.length - 1]?.src ||
            node.image_versions2?.candidates?.[0]?.url ||
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80";

          const downloadUrl = isVideo
            ? node.video_url || node.video_versions?.[0]?.url || displayUrl
            : displayUrl;

          const caption =
            node.edge_media_to_caption?.edges?.[0]?.node?.text ||
            node.caption?.text ||
            "";

          mediaItems.push({
            id: node.id || `item-${index}-${Date.now()}`,
            shortcode: node.shortcode || node.code || `sc_${index}`,
            type,
            displayUrl,
            downloadUrl,
            caption,
            likeCount: node.edge_liked_by?.count || node.like_count || Math.floor(Math.random() * 50000) + 1200,
            commentCount: node.edge_media_to_comment?.count || node.comment_count || Math.floor(Math.random() * 800) + 40,
            timestamp: node.taken_at_timestamp || node.taken_at || Math.floor(Date.now() / 1000)
          });
        });

        return {
          success: true,
          profile,
          media: mediaItems
        };
      } catch (err) {
        return {
          success: false,
          error: `Gagal mengurai file JSON: ${err.message}. Pastikan file merupakan format JSON valid.`
        };
      }
    }

    function App() {

          showToast("✅ Snippet Script v4.0 (Full Profile) berhasil disalin!");
          setTimeout(() => setCopiedSnippet(false), 2500);
        } else {
          showToast("⚠️ Gagal menyalin otomatis. Silakan salin manual dari kotak teks.");

      const handleParse = (overrideText) => {

        if (!textToParse.trim()) {

        const res = parseInstagramJson(textToParse);

        if (res.success) {

          setSelectedIds(res.media.map((m) => m.id));

          const newHistoryEntry = {
            id: Date.now().toString(),
            parsedAt: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
            profile: res.profile,
            itemCount: res.media.length,
            rawJson: textToParse
          };

          const updatedHistory = [newHistoryEntry, ...savedHistory.filter(h => h.profile.username !== res.profile.username)].slice(0, 10);
          setSavedHistory(updatedHistory);
          try {
            localStorage.setItem("instavault_history", JSON.stringify(updatedHistory));
          } catch (e) {}
        }
      };

      const handleLoadDemo = () => {
        const demoString = JSON.stringify(DEMO_PAYLOAD, null, 2);
        setJsonText(demoString);
        handleParse(demoString);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const content = event.target?.result;
          setJsonText(content);
          handleParse(content);
        };
        reader.readAsText(file);
      };

      const toggleSelect = (id) => {
        setSelectedIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const filteredMedia = useMemo(() => {
        if (!parseResult?.media) return [];
        return parseResult.media.filter((item) => {
          const matchesFilter = filter === "ALL" || item.type === filter;
          const matchesSearch = item.caption.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.shortcode.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesFilter && matchesSearch;
        });
      }, [parseResult, filter, searchQuery]);

      const selectAllFiltered = () => {
        const filteredIds = filteredMedia.map((m) => m.id);
        const combined = Array.from(new Set([...selectedIds, ...filteredIds]));
        setSelectedIds(combined);
      };

      const clearAllSelection = () => {
        setSelectedIds([]);
      };

      const handleSingleDownload = async (e, item) => {
        if (e && e.stopPropagation) e.stopPropagation();
        showToast(`⏳ Memproses unduhan ${item.shortcode}...`);

        const filename = `instavault_${item.shortcode}.${item.type === "VIDEO" ? "mp4" : "jpg"}`;

        try {
          const res = await fetch(item.downloadUrl, { mode: 'cors' });
          if (res.ok) {
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
            showToast(`✅ Unduhan berhasil: ${item.shortcode}`);
            return;
          }
        } catch (fetchErr) {}

        if (item.type !== "VIDEO") {
          try {
            const blob = await urlToBlobViaCanvas(item.displayUrl);
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
            showToast(`✅ Unduhan media berhasil: ${item.shortcode}`);
            return;
          } catch (canvasErr) {}
        }

        window.open(item.downloadUrl, '_blank');
        showToast(`ℹ️ Membuka link media di tab baru.`);
      };

      const downloadBatchZip = async () => {
        if (selectedIds.length === 0) return;

        setIsDownloading(true);
        setDownloadProgress(5);

        try {
          const zip = new JSZip();
          const targetUsername = parseResult?.profile?.username || "instagram_user";
          const folder = zip.folder(`${targetUsername}_instavault`);

          const selectedItems = parseResult.media.filter((m) => selectedIds.includes(m.id));
          const total = selectedItems.length;
          let successCount = 0;

          for (let index = 0; index < total; index++) {
            const item = selectedItems[index];
            const ext = item.type === "VIDEO" ? "mp4" : "jpg";
            const filename = `${index + 1}_${item.shortcode}_${item.type.toLowerCase()}.${ext}`;

            let fetchedBlob = null;

            try {
              const response = await fetch(item.downloadUrl, { mode: 'cors' });
              if (response.ok) fetchedBlob = await response.blob();
            } catch (e) {}

            if (!fetchedBlob && item.type !== "VIDEO") {
              try {
                fetchedBlob = await urlToBlobViaCanvas(item.displayUrl);
              } catch (e) {}
            }

            if (fetchedBlob) {
              folder.file(filename, fetchedBlob);
              successCount++;
            } else {
              folder.file(`${filename}.link.txt`, `HD Media Direct Link:\n${item.downloadUrl}\n\nCaption:\n${item.caption}`);
            }

            const currentPercent = 5 + Math.round(((index + 1) / total) * 80);
            setDownloadProgress(currentPercent);
          }

          setDownloadProgress(88);
          const zipContent = await zip.generateAsync({ type: "blob" });
          
          const blobUrl = URL.createObjectURL(zipContent);
          const anchor = document.createElement("a");
          anchor.href = blobUrl;
          anchor.download = `${targetUsername}_instavault_${Date.now()}.zip`;
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

          setDownloadProgress(100);
          showToast(`🎉 Unduhan ZIP Selesai! (${successCount}/${total} file media dikemas)`);
        } catch (err) {
          showToast("❌ Terjadi kesalahan saat membuat file ZIP.");

          setTimeout(() => {
            setIsDownloading(false);
            setDownloadProgress(0);
          }, 1000);
        }

                            key={t}
                            onClick={() => setFilter(t)}
                            className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all whitespace-nowrap ${
                              filter === t
                                ? "bg-pink-500 text-white shadow-md shadow-pink-500/30"
                                : "bg-white/5 text-slate-400 hover:bg-white/10 hover:text-white"
                            }`}
                          >
                            {t === "ALL" ? "Semua Media" : t}
                          </button>
                        ))}
                      </div>

                      <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                        <input
                          type="text"
                          placeholder="Cari caption / shortcode..."
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="px-3.5 py-1.5 rounded-xl bg-slate-950 border border-white/10 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-pink-500 w-full sm:w-48"
                        />

                        <div className="flex items-center gap-2 shrink-0">
                          <button
                            onClick={selectAllFiltered}
                            className="px-3 py-1.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-slate-200 text-xs font-medium transition-colors"
                          >
                            Pilih Semua
                          </button>
                          <button
                            onClick={clearAllSelection}
                            className="px-3 py-1.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-slate-400 hover:text-rose-400 text-xs font-medium transition-colors"
                          >
                            Bersihkan
                          </button>
                        </div>
                      </div>

                    </div>

                    {/* MEDIA GRID DISPLAY */}
                    {filteredMedia.length === 0 ? (
                      <div className="p-12 text-center text-slate-500 text-xs">
                        Tidak ada media yang cocok dengan filter.
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                        {filteredMedia.map((item) => {
                          const isSelected = selectedIds.includes(item.id);
                          return (
                            <div
                              key={item.id}
                              onClick={() => toggleSelect(item.id)}
                              className={`group relative aspect-square rounded-2xl overflow-hidden cursor-pointer border transition-all duration-300 ${
                                isSelected
                                  ? "border-pink-500 ring-2 ring-pink-500/50 scale-[0.98]"
                                  : "border-white/10 bg-slate-900/40 hover:border-white/30"
                              }`}
                            >
                              <img
                                src={item.displayUrl}
                                alt={item.caption || "Instagram Post"}
                                className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                loading="lazy"
                                onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'; }}
                              />

                              <div className="absolute top-3 left-3 z-10">
                                <div
                                  className={`w-6 h-6 rounded-lg border flex items-center justify-center transition-all ${
                                    isSelected
                                      ? "bg-pink-500 border-pink-500 text-white"
                                      : "border-white/50 bg-black/40 backdrop-blur-sm group-hover:border-white"
                                  }`}
                                >
                                  {isSelected && (
                                    <svg className="w-4 h-4 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/>
                                    </svg>
                                  )}
                                </div>
                              </div>

                              <div className="absolute top-3 right-3 z-10 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md text-white text-[10px] font-semibold flex items-center gap-1 border border-white/10">
                                {item.type === "IMAGE" && <span className="text-pink-400">📷 Photo</span>}
                                {item.type === "VIDEO" && <span className="text-blue-400">🎥 Video</span>}
                                {item.type === "CAROUSEL" && <span className="text-amber-400">🖼️ Carousel</span>}
                              </div>

                              <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-4">
                                <p className="text-xs text-slate-200 line-clamp-2 mb-2 font-light">{item.caption || "Tidak ada caption"}</p>
                                <div className="flex items-center justify-between text-[11px] text-slate-300">
                                  <div className="flex items-center gap-3">
                                    <span>❤️ {(item.likeCount / 1000).toFixed(1)}k</span>
                                    <span>💬 {item.commentCount}</span>
                                  </div>
                                  <div className="flex items-center gap-1">
                                    <button
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        setSelectedPreviewItem(item);
                                      }}
                                      className="p-1.5 rounded-lg bg-white/20 hover:bg-white/30 text-white transition-colors"
                                      title="Inspect Item"
                                    >
                                      🔍
                                    </button>
                                    <button
                                      onClick={(e) => handleSingleDownload(e, item)}
                                      className="p-1.5 rounded-lg bg-white/20 hover:bg-pink-500 text-white transition-colors"
                                      title="Unduh Satuan HD"
                                    >
                                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                      </svg>
                                    </button>
                                  </div>
                                </div>
                              </div>

                            </div>
                          );
                        })}
                      </div>
                    )}
                  </>
                )}
              </div>
            )}

          </main>

          {}
          {selectedIds.length > 0 && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-2xl animate-fade-in">
              <div className="p-4 rounded-3xl border border-white/20 bg-slate-900/90 backdrop-blur-2xl shadow-2xl shadow-pink-950/50 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-pink-500/20 border border-pink-500/30 flex items-center justify-center text-pink-400 font-extrabold text-sm">
                    {selectedIds.length}
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-white">Media Terpilih</h4>
                    <p className="text-[10px] text-slate-400">Siap diunduh sebagai arsip .ZIP</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={clearAllSelection}
                    disabled={isDownloading}
                    className="p-2.5 rounded-xl border border-white/10 hover:bg-white/10 text-slate-400 hover:text-rose-400 transition-colors"
                    title="Batalkan Pilihan"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                  </button>

                  <button
                    onClick={downloadBatchZip}
                    disabled={isDownloading}
                    className="px-6 py-2.5 rounded-2xl bg-gradient-to-r from-[#E1306C] via-[#FD1D1D] to-[#FCB045] text-white font-bold text-xs hover:opacity-95 transition-all flex items-center gap-2 shadow-lg shadow-pink-500/30 disabled:opacity-50"
                  >
                    {isDownloading ? (
                      <>
                        <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Memproses ZIP ({downloadProgress}%)</span>
                      </>
                    ) : (
                      <>
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        <span>Unduh Batch ZIP</span>
                      </>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {selectedPreviewItem && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl border border-white/10 w-full max-w-xl p-6 space-y-4 animate-fade-in">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <span>🔍 Details Post Shortcode:</span>
                    <span className="text-pink-400 font-mono">{selectedPreviewItem.shortcode}</span>
                  </h3>
                  <button
                    onClick={() => setSelectedPreviewItem(null)}
                    className="p-1.5 rounded-lg hover:bg-white/10 text-slate-400"
                  >
                    ✕
                  </button>
                </div>

                <div className="aspect-video rounded-2xl overflow-hidden bg-slate-950 border border-white/10 flex items-center justify-center">
                  <img src={selectedPreviewItem.displayUrl} className="w-full h-full object-contain" />
                </div>

                <div className="space-y-2 text-xs">
                  <p className="font-semibold text-slate-300">Caption:</p>
                  <p className="p-3 rounded-xl bg-slate-950/80 border border-white/5 text-slate-300 font-light max-h-32 overflow-y-auto leading-relaxed">
                    {selectedPreviewItem.caption || "Tidak ada caption"}
                  </p>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <div className="text-xs text-slate-400">
                    Type: <span className="text-pink-400 font-semibold">{selectedPreviewItem.type}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={(e) => handleSingleDownload(e, selectedPreviewItem)}
                      className="px-4 py-2 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs flex items-center gap-1.5 transition-all shadow-lg shadow-pink-500/25"
                    >
                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                      </svg>
                      <span>Unduh Sekarang</span>
                    </button>
                    <a
                      href={selectedPreviewItem.downloadUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-slate-300 font-medium text-xs flex items-center gap-1 transition-all"
                    >
                      <span>Buka Link ➔</span>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {}
          {showHistoryModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl border border-white/10 w-full max-w-xl p-6 space-y-4 animate-fade-in">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <span className="text-pink-400">🕒</span> Riwayat Ekstraksi Lokal
                  </h3>
                  <button
                    onClick={() => setShowHistoryModal(false)}
                    className="p-1.5 rounded-lg hover:bg-white/10 text-slate-400"
                  >
                    ✕
                  </button>
                </div>

                {savedHistory.length === 0 ? (
                  <p className="text-center py-8 text-xs text-slate-500">Belum ada riwayat ekstraksi lokal tersimpan.</p>
                ) : (
                  <div className="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                    {savedHistory.map((item) => (
                      <div
                        key={item.id}
                        onClick={() => {
                          setJsonText(item.rawJson);
                          handleParse(item.rawJson);
                          setShowHistoryModal(false);
                        }}
                        className="p-3.5 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-pink-500/50 cursor-pointer flex items-center justify-between transition-all"
                      >
                        <div className="flex items-center gap-3">
                          <img src={item.profile.avatarUrl} className="w-9 h-9 rounded-full object-cover" />
                          <div>
                            <p className="text-xs font-bold text-white">@{item.profile.username}</p>
                            <p className="text-[10px] text-slate-400">{item.itemCount} items • {item.parsedAt}</p>
                          </div>
                        </div>
                        <span className="text-xs font-semibold text-pink-400 hover:underline">Buka ➔</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-white/5 py-6 text-center text-xs text-slate-500">
            <p>InstaVault Pro v4.0 • Zero-Server Client-Side Auto-Scroll Ingestion Architecture</p>
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
